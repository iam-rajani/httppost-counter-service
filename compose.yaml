services:
  counter-service:
    container_name: counter-service-exercise
    build:
      context: .
    # Locally this defaults to local/httppost-counter-service:latest.
    # On EC2 the CI workflow overrides ECR_REGISTRY and IMAGE_TAG after pulling the image.
    image: ${ECR_REGISTRY:-local}/httppost-counter-service:${IMAGE_TAG:-latest}
    volumes:
      # Named volume keeps counter.txt writable by the non-root user in the image.
      - counter-data:/data
    ports:
      # Local dev: http://localhost:8080. On EC2 the workflow sets HOST_PORT=80.
      - "${HOST_PORT:-8080}:8080"
    restart: always
    mem_limit: 256M
    cpus: 0.5

volumes:
  counter-data:
